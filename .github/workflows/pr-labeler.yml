name: PR Labels

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number, "all" for full backfill, or empty for no-op'
        default: ''
      dry_run:
        description: 'Log labels without applying'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

# No concurrency group. Cancelling a run leaves a `cancelled` check run on the
# head commit permanently, and Renovate reads every check run without discarding
# superseded ones (renovatebot/renovate#36837), so it computes a red branch
# status and silently refuses to automerge. The "latest run wins" ordering that
# cancellation provided now lives in pr_labeler.py, which stands down when the
# PR's body or head sha moved under it -- same ordering, no red check left behind.

jobs:
  label:
    uses: trufflesecurity/.github/.github/workflows/pr-labeler-reusable.yml@main
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      # workflow_dispatch boolean inputs can arrive as strings (actions/runner#3571).
      # Compare both shapes so 'false' is treated as the boolean false, not as a
      # truthy string by the `|| false` short-circuit pattern.
      dry_run: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
